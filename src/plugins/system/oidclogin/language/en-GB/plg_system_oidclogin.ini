PLG_SYSTEM_OIDCLOGIN_FIELD_ISSUER_DESC="The OpenID Connect Issuer URL. Authorization, token, JWKS, and end-session endpoints are auto-discovered from <b>&lt;issuer&gt;/.well-known/openid-configuration</b>."
PLG_SYSTEM_OIDCLOGIN_FIELD_LOCALE_LABEL="Use locale"
PLG_SYSTEM_OIDCLOGIN_FIELD_LOCALE_DESC="Pass the current site language as a locale hint to the identity provider"
PLG_SYSTEM_OIDCLOGIN_FIELDSET_CLIENT_LABEL="Client"
PLG_SYSTEM_OIDCLOGIN_FIELDSET_CLIENT_DESC="Confidential client credentials registered with the identity provider"
PLG_SYSTEM_OIDCLOGIN_FIELD_CLIENT_ID_LABEL="Client ID"
PLG_SYSTEM_OIDCLOGIN_FIELD_CLIENT_ID_DESC="The OAuth 2.0 client identifier registered with the identity provider"
PLG_SYSTEM_OIDCLOGIN_FIELD_CLIENT_SECRET_LABEL="Client secret"
PLG_SYSTEM_OIDCLOGIN_FIELD_CLIENT_SECRET_DESC="The confidential client secret. Masked in this form; stored as plain text like other Joomla! core password fields (e.g. the LDAP plugin's bind password)."
PLG_SYSTEM_OIDCLOGIN_FIELDSET_ATTRIBUTES_LABEL="Attributes"
PLG_SYSTEM_OIDCLOGIN_FIELDSET_ATTRIBUTES_DESC="The attributes are determined by claim names in the merged ID Token and UserInfo response. Nested claims can be reached with a dot-path expression, e.g. <b>realm_access.roles</b>."
PLG_SYSTEM_OIDCLOGIN_FIELD_USERNAME_CLAIM_LABEL="Username claim"
PLG_SYSTEM_OIDCLOGIN_FIELD_USERNAME_CLAIM_DESC="The claim name (or dot-path) supplying the Joomla! username. Defaults to <b>email</b>, matching the CAS server's default identity claim, so the same identity resolves to the same Joomla username across both protocols. Not all providers verify or even include this claim by default (some gate it behind an <b>email</b> scope); <b>preferred_username</b> is the OIDC-standard alternative when email isn't reliably available."
PLG_SYSTEM_OIDCLOGIN_FIELD_NAME_CLAIM_LABEL="Full name claim"
PLG_SYSTEM_OIDCLOGIN_FIELD_NAME_CLAIM_DESC="The claim name (or dot-path) supplying the Joomla! full name"
PLG_SYSTEM_OIDCLOGIN_FIELD_EMAIL_CLAIM_LABEL="Email claim"
PLG_SYSTEM_OIDCLOGIN_FIELD_EMAIL_CLAIM_DESC="The claim name (or dot-path) supplying the Joomla! email address"
PLG_SYSTEM_OIDCLOGIN_FIELD_GROUPS_CLAIM_LABEL="Groups claim"
PLG_SYSTEM_OIDCLOGIN_FIELD_GROUPS_CLAIM_DESC="The claim name (or dot-path, e.g. realm_access.roles) supplying group/role membership. Leave empty to skip group mapping. <b>Known limitation:</b> Azure AD's opaque group-GUID <b>groups</b> claim is not resolved to Joomla! groups; use Azure AD App Roles instead."
PLG_SYSTEM_OIDCLOGIN_FIELD_GROUP_INTEGER_LABEL="Integer groups"
PLG_SYSTEM_OIDCLOGIN_FIELD_GROUP_INTEGER_DESC="Consider integer groups as their Joomla! identifier"
PLG_SYSTEM_OIDCLOGIN_FIELD_GROUP_SEPARATOR_LABEL="Group separator"
PLG_SYSTEM_OIDCLOGIN_FIELD_GROUP_SEPARATOR_DESC="Group separator used between parent and child groups"
PLG_SYSTEM_OIDCLOGIN_FIELDSET_CONNECTION_LABEL="Connection"
PLG_SYSTEM_OIDCLOGIN_FIELDSET_CONNECTION_DESC=""
PLG_SYSTEM_OIDCLOGIN_FIELD_AUTOMATIC_LOGIN_LABEL="Automatic login"
PLG_SYSTEM_OIDCLOGIN_FIELD_AUTOMATIC_LOGIN_DESC="This allows automatic login when the user is already logged in at the <b>OIDC</b> identity provider"
PLG_SYSTEM_OIDCLOGIN_FIELD_AUTOMATIC_LOGOUT_LABEL="Automatic logout"
PLG_SYSTEM_OIDCLOGIN_FIELD_AUTOMATIC_LOGOUT_DESC="This allows automatic logout from the <b>OIDC</b> identity provider (RP-Initiated Logout) when the user logs out from the Joomla! site"
PLG_SYSTEM_OIDCLOGIN_FIELD_POST_LOGOUT_REDIRECT_LABEL="Post-logout redirect"
PLG_SYSTEM_OIDCLOGIN_FIELD_POST_LOGOUT_REDIRECT_DESC="Optional URL the identity provider redirects to after RP-Initiated Logout completes. Leave empty to rely on the computed return state."
PLG_SYSTEM_OIDCLOGIN_FIELD_TIMEOUT_LABEL="Timeout"
PLG_SYSTEM_OIDCLOGIN_FIELD_TIMEOUT_DESC="Timeout in seconds for calls to the <b>OIDC</b> identity provider"
PLG_SYSTEM_OIDCLOGIN_EMAIL_NOT_VERIFIED="Login denied: the identity provider reports that this email address is not verified."

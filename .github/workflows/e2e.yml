name: E2E Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'e2e/**'
      - '.devcontainer/**'
      - 'composer.json'
      - 'composer.lock'
      - 'manifest.xml'
      - 'bundle.sh'
      - 'bundle.php'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

permissions:
  contents: read
  # buildx type=gha cache-to needs write on private repos; harmless on public
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        joomla:
          # Always set build-args so Joomla 6 is not a special empty case.
          - version: "5"
            php-version: "8.3"
            joomla-version: "5.4.8"
          - version: "6"
            php-version: "8.4"
            joomla-version: "6.1.3"
    name: E2E (Joomla ${{ matrix.joomla.version }})
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Prepare host environment
      - name: Create required directories and certificates
        working-directory: .devcontainer
        run: |
          mkdir -p joomla/logs
          ./generate-certs.sh .secrets
          echo "127.0.0.1 www.dev.local auth.dev.local" | sudo tee -a /etc/hosts

      # Docker image preparation
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # type=gha only persists reliably via docker/build-push-action (or bake-action).
      # Scopes match .github/workflows/e2e-image-cache.yml (main warms caches for
      # first-run PRs; PR jobs can restore from the default branch).
      - name: Pull service images
        working-directory: .devcontainer
        # Tags come from compose.yml (SSOT); only Hub services — not joomla/keycloak.
        run: docker compose pull mysql traefik

      - name: Build Joomla image
        uses: docker/build-push-action@v7
        with:
          context: .devcontainer/joomla
          build-args: |
            JOOMLA_VERSION=${{ matrix.joomla.joomla-version }}
            PHP_VERSION=${{ matrix.joomla.php-version }}
          load: true
          tags: joomla:external-login
          cache-from: type=gha,scope=joomla-${{ matrix.joomla.version }}
          cache-to: type=gha,mode=max,scope=joomla-${{ matrix.joomla.version }}

      - name: Build Keycloak image
        uses: docker/build-push-action@v7
        with:
          context: .devcontainer/keycloak
          load: true
          tags: keycloak:cas
          cache-from: type=gha,scope=keycloak
          cache-to: type=gha,mode=max,scope=keycloak

      # Start services and install applications
      - name: Start Docker Compose services
        working-directory: .devcontainer
        run: docker compose up -d --no-build

      - name: Setup Joomla and install extension
        run: .devcontainer/joomla/install.sh

      # E2E test preparation
      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Aube store
        uses: actions/cache@v6
        with:
          path: ~/.local/share/aube/store/v1
          key: ${{ runner.os }}-aube-store-${{ hashFiles('e2e/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-aube-store-

      - name: Install E2E dependencies
        working-directory: e2e
        run: aube install

      - name: Get Playwright version
        working-directory: e2e
        run: echo "PLAYWRIGHT_VERSION=$(aubx playwright --version | cut -d' ' -f2)" >> $GITHUB_ENV

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install Playwright browsers and dependencies
        working-directory: e2e
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != 'true' ]; then
            echo "Cache miss - Installing browsers with system dependencies..."
            aubx playwright install --with-deps chromium
          else
            echo "Cache hit - Installing system dependencies only..."
            aubx playwright install-deps chromium
          fi

      - name: Run E2E tests
        working-directory: e2e
        run: aubr test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-joomla-${{ matrix.joomla.version }}
          path: e2e/playwright-report/
          retention-days: 7
      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results-joomla-${{ matrix.joomla.version }}
          path: e2e/test-results/
          retention-days: 7

      - name: Collect diagnostic information on failure
        if: failure()
        working-directory: .devcontainer
        run: |
          echo "=================================================="
          echo "Diagnostic Information Collection (Joomla ${{ matrix.joomla.version }})"
          echo "=================================================="

          echo ""
          echo "=== Container Status ==="
          docker compose ps

          echo ""
          echo "=== Joomla Container Logs (last 100 lines) ==="
          docker compose logs joomla --tail=100

          echo ""
          echo "=== Keycloak Container Logs (last 100 lines) ==="
          docker compose logs keycloak --tail=100

          echo ""
          echo "=== MySQL Container Logs (last 50 lines) ==="
          docker compose logs mysql --tail=50

          echo ""
          echo "=== Joomla Error Logs ==="
          docker compose exec joomla sh -c 'tail -100 /var/www/html/administrator/logs/everything.php 2>/dev/null || echo "No Joomla error logs found"'

          echo ""
          echo "=================================================="
          echo "Diagnostic collection completed"
          echo "=================================================="

      - name: Upload diagnostic logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostic-logs-joomla-${{ matrix.joomla.version }}
          path: |
            .devcontainer/joomla/logs/
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop Docker Compose services
        if: always()
        working-directory: .devcontainer
        run: docker compose down -v
